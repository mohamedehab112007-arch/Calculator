<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>
<body>
  <div class="main_body">
   <div class="signature_box"></div>
     <div class="screen">
     </div>
     <div class="buttons">
      <button class="number" id="num">0</button>
      <button class="number" id="num">1</button>
      <button class="number" id="num">2</button>
      <button class="number" id="num">3</button>
      <button class="number" id="num">4</button>
      <button class="number" id="num">5</button>
      <button class="number" id="num">6</button>
      <button class="number" id="num">7</button>
      <button class="number" id="num">8</button>
      <button class="number" id="num">9</button>
      <button class="number" id="operator">+</button>
      <button class="number" id="operator">-</button>
      <button class="number" id="operator">*</button>
      <button class="number" id="operator">/</button>
      <button class="number" id="clear">C</button>
      <button class="number" id="equal">=</button>
     </div>
  </div>
    
</body>
</html>
